<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Eventos & Constancias | Tech Hub</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="styles.css">
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="tech-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <main class="app-container">
    <!-- Header del Sistema -->
    <header class="app-header">
      <div class="badge-tech"><span class="pulse-dot"></span> Módulo de Certificación V2.5</div>
      <h1>Gestor de Eventos & Talleres</h1>
      <p>Configura, valida y genera certificados con precisión institucional.</p>
    </header>

    <div class="grid-layout">
      <!-- Formulario interactivo -->
      <section class="card form-card glass-panel">
        <div class="card-header">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <h2>Parámetros del Evento</h2>
        </div>

        <form id="eventoForm" onsubmit="event.preventDefault();">
          
          <!-- Tipo de Evento -->
          <div class="input-group">
            <label for="tipoEvento">Tipo de Evento</label>
            <div class="select-wrapper">
              <select id="tipoEvento" required>
                <option value="" disabled selected>-- Selecciona un tipo de evento --</option>
                <option value="VISITA_IE">VISITA DE INSTITUCIONES EDUCATIVAS A LA PLANTA</option>
                <option value="VISITA_ADULTOS">VISITA DE ADULTOS A LA PLANTA</option>
                <option value="TALLER_IE">TALLER A INSTITUCIONES EDUCATIVAS</option>
                <option value="TALLER_EMPRESAS">TALLER A EMPRESAS</option>
                <option value="TALLER_COMUNIDAD">TALLER A LA COMUNIDAD</option>
                <option value="TALLER_VIRTUAL">TALLER VIRTUAL</option>
              </select>
            </div>
          </div>

          <!-- Subcategoría (Dinamica) -->
          <div class="input-group">
            <label for="subCategoria">Subcategoría / Entidad</label>
            <div class="select-wrapper">
              <select id="subCategoria" required disabled>
                <option value="" disabled selected>-- Selecciona un tipo de evento primero --</option>
              </select>
            </div>
          </div>

          <!-- Nombre de Institución -->
          <div class="input-group">
            <label for="nombreInstitucion">Nombre de la Institución / Empresa</label>
            <input type="text" id="nombreInstitucion" placeholder="Ej: San Juan Bautista" autocomplete="off" required>
          </div>

          <!-- Distrito -->
          <div class="input-group">
            <label for="distrito">Distrito / Localidad</label>
            <input type="text" id="distrito" placeholder="Ej: Miraflores" autocomplete="off" required>
          </div>

          <!-- Acciones -->
          <button type="button" id="btnGenerarPDF" class="btn-tech">
            <span>Generar Documento PDF</span>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <polyline points="9 15 12 18 15 15"></polyline>
            </svg>
          </button>
        </form>
      </section>

      <!-- Visualización en vivo -->
      <section class="card preview-card glass-panel">
        <div class="card-header">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <h2>Previsualización en Tiempo Real</h2>
        </div>
        
        <div class="preview-document-box">
          <div class="doc-watermark">PREVIEW</div>
          <div class="doc-content">
            <span class="doc-tag" id="prevTag">TIPO DE EVENTO</span>
            <h3 id="prevTitulo">SELECCIONE UN EVENTO</h3>
            <div class="doc-divider"></div>
            <p id="prevSubtitulo" class="doc-sub">INFORMACIÓN DE LA INSTITUCIÓN Y DISTRITO</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
